<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StartUp Compass</title>
<meta name="description" content="Outils gratuits pour entrepreneurs : 30 idées, Business Model Canvas, business plan, SWOT et coûts de lancement.">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<style>
/* Layout: a navy chart-room header with the compass mark, a tab strip of tools, one working surface per tool. */
:root{
  --bg:#F3F6FA; --surface:#FFFFFF; --sunk:#E8EEF5; --ink:#10233F; --muted:#56677E; --line:#D3DCE7;
  --band:#10233F; --band-ink:#F3F6FA; --band-muted:#A9B8CC;
  --north:#C8402A; --sea:#17708A; --sea-soft:#DDEEF2; --ok:#1E7A4E; --warn:#A8610A;
  --display:"Bricolage Grotesque","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark;
    --bg:#0C1626; --surface:#142238; --sunk:#0F1B2E; --ink:#E8EEF6; --muted:#9FB0C6; --line:#27384F;
    --band:#081120; --band-ink:#E8EEF6; --band-muted:#8496AE;
    --north:#EE7A62; --sea:#5FB8CF; --sea-soft:#17344A; --ok:#5CC48F; --warn:#E3A552; }
}
:root[data-theme="dark"]{ color-scheme:dark;
  --bg:#0C1626; --surface:#142238; --sunk:#0F1B2E; --ink:#E8EEF6; --muted:#9FB0C6; --line:#27384F;
  --band:#081120; --band-ink:#E8EEF6; --band-muted:#8496AE;
  --north:#EE7A62; --sea:#5FB8CF; --sea-soft:#17344A; --ok:#5CC48F; --warn:#E3A552; }
*,*::before,*::after{ box-sizing:border-box; }
body{ background:var(--bg); color:var(--ink); font-family:var(--body); font-size:1rem; line-height:1.55; }
.gut{ padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
.inner{ max-width:70rem; margin:0 auto; }
h1,h2,h3{ font-family:var(--display); text-wrap:balance; margin:0; line-height:1.15; }
[dir="rtl"] h1,[dir="rtl"] h2,[dir="rtl"] h3{ line-height:1.5; }
p{ margin:0; }
button,input,textarea,select{ font:inherit; color:inherit; }
:focus-visible{ outline:2px solid var(--sea); outline-offset:2px; border-radius:4px; }

.band{ background:var(--band); color:var(--band-ink); padding-block:1.4rem 0; }
.brand{ display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap; }
.logo{ display:flex; align-items:center; gap:.7rem; }
.logo svg{ width:2.6rem; height:2.6rem; flex:none; }
.logo .needle{ transform-origin:24px 24px; animation:settle 1.6s cubic-bezier(.3,1.6,.5,1) both; }
@keyframes settle{ from{ transform:rotate(-70deg); } to{ transform:rotate(0); } }
.logo b{ font-family:var(--display); font-size:1.35rem; font-weight:700; letter-spacing:-.01em; }
.lang{ display:flex; gap:.25rem; }
.lang button{ border:1px solid transparent; background:transparent; color:var(--band-muted); padding:.4rem .75rem; border-radius:999px; cursor:pointer; font-weight:600; min-height:2.5rem; }
.lang button[aria-pressed="true"]{ color:var(--band-ink); border-color:var(--band-muted); }
.pitch{ margin-top:1.4rem; max-width:44rem; }
.pitch h1{ font-size:clamp(1.7rem,5vw,2.6rem); font-weight:700; }
.pitch p{ color:var(--band-muted); margin-top:.6rem; }
.tabs{ display:flex; flex-wrap:wrap; gap:.25rem; margin-top:1.5rem; }
.tabs a{ color:var(--band-muted); text-decoration:none; font-weight:600; padding:.7rem .95rem; border-radius:.6rem .6rem 0 0; }
.tabs a[aria-current="page"]{ background:var(--bg); color:var(--ink); }

main{ padding-block:1.8rem 3rem; }
.head{ display:flex; justify-content:space-between; align-items:flex-end; gap:1rem; flex-wrap:wrap; margin-bottom:1.2rem; }
.head h2{ font-size:1.55rem; font-weight:700; }
.head p{ color:var(--muted); max-width:42rem; margin-top:.3rem; }
.actions{ display:flex; gap:.5rem; flex-wrap:wrap; }
.btn{ border:1px solid var(--line); background:var(--surface); padding:.55rem .95rem; border-radius:.5rem; cursor:pointer; font-weight:600; min-height:2.6rem; }
.btn:hover{ border-color:var(--sea); }
.btn.primary{ background:var(--sea); border-color:var(--sea); color:#fff; }
:root[data-theme="dark"] .btn.primary{ color:#06202A; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn.primary{ color:#06202A; } }
.btn.quiet{ background:transparent; color:var(--muted); }
.note{ font-size:.9rem; color:var(--muted); }
.flag{ display:inline-block; font-size:.78rem; font-weight:600; color:var(--warn); border:1px solid currentColor; border-radius:999px; padding:.05rem .55rem; }

input[type="text"],input[type="number"],input[type="search"],textarea,select{ width:100%; background:var(--surface); border:1px solid var(--line); border-radius:.45rem; padding:.55rem .7rem; min-width:0; }
textarea{ resize:vertical; min-height:6.5rem; line-height:1.5; }
label{ font-weight:600; font-size:.92rem; display:block; margin-bottom:.3rem; }

.filters{ display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr); gap:.6rem; margin-bottom:.6rem; }
@media (max-width:40rem){ .filters{ grid-template-columns:1fr; } }
.ideas{ display:grid; gap:.6rem; margin-top:.8rem; }
.idea{ background:var(--surface); border:1px solid var(--line); border-radius:.6rem; }
.idea summary{ cursor:pointer; padding:.85rem 1rem; display:flex; flex-wrap:wrap; gap:.4rem .8rem; align-items:baseline; list-style:none; }
.idea summary::-webkit-details-marker{ display:none; }
.idea summary b{ font-family:var(--display); font-size:1.08rem; flex:1 1 14rem; min-width:0; }
.chip{ font-size:.8rem; font-weight:600; background:var(--sea-soft); color:var(--sea); border-radius:999px; padding:.1rem .6rem; }
.chip.inv{ background:var(--sunk); color:var(--muted); }
.idea dl{ margin:0; padding:0 1rem 1rem; display:grid; gap:.65rem; }
.idea dt{ font-size:.8rem; font-weight:600; color:var(--sea); text-transform:uppercase; letter-spacing:.05em; }
[dir="rtl"] .idea dt{ letter-spacing:0; }
.idea dd{ margin:0; }

.bmc{ display:grid; gap:.6rem; grid-template-columns:repeat(5,minmax(0,1fr)); grid-template-areas:"pa ac va re se" "pa rs va ch se"; }
.bmc2{ display:grid; gap:.6rem; grid-template-columns:repeat(2,minmax(0,1fr)); margin-top:.6rem; }
@media (max-width:56rem){ .bmc{ grid-template-columns:1fr; grid-template-areas:"se" "va" "ch" "re" "ac" "rs" "pa"; } .bmc2{ grid-template-columns:1fr; } }
.cell{ background:var(--surface); border:1px solid var(--line); border-radius:.6rem; padding:.75rem; display:flex; flex-direction:column; gap:.35rem; min-width:0; }
.cell.key{ border-color:var(--north); }
.cell label{ margin:0; font-family:var(--display); font-size:1rem; }
.cell small{ color:var(--muted); font-size:.82rem; }
.cell textarea{ flex:1; border-color:transparent; background:var(--sunk); min-height:7rem; }

.sections{ display:grid; gap:1rem; }
.sec{ background:var(--surface); border:1px solid var(--line); border-radius:.6rem; padding:1rem; }
.sec h3{ font-size:1.1rem; }
.sec .hint{ color:var(--muted); font-size:.9rem; margin:.25rem 0 .6rem; }
.fin{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:.6rem; margin-bottom:.7rem; }
@media (max-width:40rem){ .fin{ grid-template-columns:1fr; } }
.result{ background:var(--sunk); border-radius:.5rem; padding:.7rem .85rem; display:grid; gap:.3rem; font-variant-numeric:tabular-nums; }
.result div{ display:flex; justify-content:space-between; gap:1rem; }
.result strong.neg{ color:var(--north); } .result strong.pos{ color:var(--ok); }

.swot{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:.6rem; }
@media (max-width:40rem){ .swot{ grid-template-columns:1fr; } }
.swot ul{ list-style:none; margin:0; padding:0; display:grid; gap:.3rem; }
.swot li{ display:flex; gap:.5rem; align-items:flex-start; background:var(--sunk); border-radius:.4rem; padding:.4rem .6rem; }
.swot li span{ flex:1; min-width:0; overflow-wrap:anywhere; }
.x{ border:0; background:transparent; color:var(--muted); cursor:pointer; padding:0 .35rem; font-size:1.1rem; line-height:1.3; min-width:1.8rem; }
.add{ display:flex; gap:.4rem; margin-top:auto; }

.rows{ display:grid; gap:.4rem; margin:.6rem 0; }
.row{ display:grid; grid-template-columns:minmax(0,1fr) 8.5rem auto; gap:.4rem; align-items:center; }
@media (max-width:30rem){ .row{ grid-template-columns:minmax(0,1fr) 6.5rem auto; } }
.row input[type="number"]{ text-align:end; font-variant-numeric:tabular-nums; }
.two{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1rem; }
@media (max-width:52rem){ .two{ grid-template-columns:1fr; } }

.ai-out{ white-space:pre-wrap; overflow-wrap:anywhere; background:var(--surface); border:1px solid var(--line); border-radius:.6rem; padding:1rem; min-height:8rem; margin-top:.8rem; }
.toast{ position:fixed; inset-inline:0; bottom:calc(1rem + env(safe-area-inset-bottom, 0px)); display:flex; justify-content:center; pointer-events:none; padding-inline:16px; }
.toast span{ background:var(--ink); color:var(--bg); padding:.6rem 1rem; border-radius:.5rem; font-weight:600; }
footer{ border-top:1px solid var(--line); padding-block:1.2rem; color:var(--muted); font-size:.88rem; }
@media (prefers-reduced-motion: reduce){ .logo .needle{ animation:none; } }
</style>
</head>

      <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="none" stroke="var(--band-muted)" stroke-width="2"/><g stroke="var(--band-muted)" stroke-width="2" stroke-linecap="round"><path d="M24 5v4M24 39v4M5 24h4M39 24h4"/></g><g class="needle"><path d="M24 9l5 15H19z" fill="var(--north)"/><path d="M24 39l-5-15h10z" fill="var(--band-ink)"/></g><circle cx="24" cy="24" r="2.2" fill="var(--band)"/></svg>

let S = store.get("state") || clone(EX);
let isExample = !store.get("state");
let lang = store.get("lang") || "fr";
if(!L[lang]) lang = "fr";
const li = () => ({fr:1,en:2,ar:3})[lang];
const t = k => L[lang][k];
const save = () => { isExample = false; store.set("state", S); };
const cap = name => (window.claude && window.claude.use) ? window.claude.use(name).catch(() => null) : Promise.resolve(null);
const dlP = cap("downloads"), aiP = cap("sample");

function h(tag, a, ...kids){ const e = document.createElement(tag);
  for(const k in (a||{})){ const v = a[k];
    if(k==="class") e.className = v; else if(k==="text") e.textContent = v; else if(k==="value") e.value = v;
    else if(k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if(v===true) e.setAttribute(k,""); else if(v!==false && v!=null) e.setAttribute(k, v); }
  for(const c of kids.flat(Infinity)){ if(c==null) continue; e.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return e; }
const $ = id => document.getElementById(id);
let toastT; function toast(m){ const el = $("toast"); el.textContent = m; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 3200); }
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const eur = n => new Intl.NumberFormat(lang==="ar" ? "ar-u-nu-latn" : lang==="en" ? "en-GB" : "fr-FR", {style:"currency", currency:"EUR", maximumFractionDigits:0}).format(n);

/* ---------- pure calculations ---------- */
function finCalc(f){ const rev = num(f.rev), v = num(f.varp)/100, fixed = num(f.fixed);
  return { margin: rev*(1-v) - fixed, breakeven: v < 1 ? fixed/(1-v) : null }; }
function costCalc(c){ const once = c.once.reduce((s,r) => s+num(r[1]), 0), monthly = c.monthly.reduce((s,r) => s+num(r[1]), 0) * num(c.months);
  const cont = (once+monthly) * num(c.cont)/100; return { once, monthly, cont, grand: once+monthly+cont }; }

/* ---------- export ---------- */
const hasArabic = s => /[؀-ۿ]/.test(s);
const pdfSafe = s => String(s).replace(/[‘’]/g,"'").replace(/[“”«»]/g,'"').replace(/€/g,"EUR").replace(/œ/g,"oe").replace(/Œ/g,"OE").replace(/[–—]/g,"-").replace(/…/g,"...").replace(/[  ]/g," ");
function makePdf(title, blocks){ const doc = new window.jspdf.jsPDF({unit:"pt", format:"a4"}); const W = 595, M = 56; let y = 72;
  const write = (txt, size, style, gap) => { doc.setFont("helvetica", style); doc.setFontSize(size);
    for(const line of doc.splitTextToSize(pdfSafe(txt), W-2*M)){ if(y > 780){ doc.addPage(); y = 64; } doc.text(line, M, y); y += size*1.4; } y += gap; };
  write(title, 20, "bold", 4); write("StartUp Compass", 9, "normal", 16);
  for(const b of blocks){ write(b[0], 13, "bold", 2); write(b[1] || "-", 10.5, "normal", 12); }
  return doc.output("arraybuffer"); }
function makeHtml(title, blocks){ const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"})[c]);
  return '<!doctype html><html lang="'+lang+'" dir="'+(lang==="ar"?"rtl":"ltr")+'"><meta charset="utf-8"><title>'+esc(title)+'</title><style>body{font-family:system-ui,sans-serif;max-width:44rem;margin:2rem auto;padding:0 1rem;line-height:1.7}h2{margin-top:1.6rem}p{white-space:pre-wrap}</style><h1>'+esc(title)+'</h1>'+blocks.map(b => '<h2>'+esc(b[0])+'</h2><p>'+esc(b[1]||"-")+'</p>').join("")+'</html>'; }
const asText = (title, blocks) => title + "\n\n" + blocks.map(b => b[0].toUpperCase() + "\n" + (b[1]||"-")).join("\n\n");
function nativeSave(filename, data){ const url = URL.createObjectURL(new Blob([data], {type: filename.endsWith(".pdf") ? "application/pdf" : "text/html"}));
  const a = h("a", {href:url, download:filename}); document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); toast(t("saved")); }
async function exportDoc(title, blocks, base){ const dl = await dlP; if(!dl && window.claude){ toast(t("noDl")); return; }
  const all = title + blocks.map(b => b.join(" ")).join(" "); let filename, data;
  if(hasArabic(all) || !window.jspdf){ if(hasArabic(all)) toast(t("arPdf")); filename = base+".html"; data = makeHtml(title, blocks); }
  else { filename = base+".pdf"; data = makePdf(title, blocks); }
  if(!dl){ nativeSave(filename, data); return; }
  try{ await dl.save({filename, data}); toast(t("saved")); }catch(e){ if(e && e.code !== "declined") toast(e.code === "rate_limited" ? t("limited") : t("noDl")); } }
async function copyText(txt){ try{ await navigator.clipboard.writeText(txt); toast(t("copied")); }
  catch(e){ const ta = h("textarea", {value:txt, readonly:true, id:"copy-fallback", "aria-label":t("copy")}); ta.style.minHeight = "12rem"; ta.style.marginTop = "1rem"; $("view").append(ta); ta.focus(); ta.select(); } }
function toolbar(getDoc, base){ return h("div", {class:"actions"},
  h("button", {class:"btn primary", type:"button", id:"btn-export-"+base, text:t("exPdf"), onclick:() => { const d = getDoc(); exportDoc(d[0], d[1], base); }}),
  h("button", {class:"btn", type:"button", id:"btn-copy-"+base, text:t("copy"), onclick:() => { const d = getDoc(); copyText(asText(d[0], d[1])); }}),
  isExample ? h("button", {class:"btn quiet", type:"button", id:"btn-clear-"+base, text:t("clear"), onclick:clearAll}) : null); }
function clearAll(){ S = { bmc:{}, plan:{name:"", s:{}, fin:{rev:"",varp:"",fixed:""}}, swot:{s:[],w:[],o:[],t:[]}, costs:{once:[["",""]], monthly:[["",""]], months:3, cont:10} }; save(); render(); }
const head = (title, p, extra) => h("div", {class:"head"}, h("div", null, h("h2", {text:title}), h("p", {text:p})), extra);
const exNote = () => isExample ? h("p", {class:"note", style:"margin-bottom:1rem"}, h("span", {class:"flag", text:t("example")}), " ", t("exampleNote")) : document.createTextNode("");

/* ---------- views ---------- */
let q = "", fCat = "", fInv = "";
function viewIdeas(root){
  const list = h("div", {class:"ideas"}), count = h("p", {class:"note"});
  const draw = () => { list.textContent = ""; const needle = q.trim().toLowerCase(); let n = 0;
    IDEAS.forEach((d, i) => { if(fCat !== "" && d[1] !== +fCat) return; if(fInv !== "" && d[2] !== +fInv) return;
      if(needle && !d.join(" ").toLowerCase().includes(needle) && !CATS[d[1]].toLowerCase().includes(needle)) return; n++;
      const keys = ["f_concept","f_cible","f_rev","f_comp","f_marche","f_risk","f_dev"];
      list.append(h("details", {class:"idea", lang:"fr", dir:"ltr"}, h("summary", null, h("b", {text:d[0]}), h("span", {class:"chip", text:CATS[d[1]]}), h("span", {class:"chip inv", lang:lang, text:t("inv")[d[2]]})),
        h("dl", null, keys.map((k, j) => [h("dt", {lang:lang, text:t(k)}), h("dd", {text:d[3+j]})])))); });
    count.textContent = t("count")(n); };
  root.append(head(t("ideasH"), t("ideasP")),
    h("div", {class:"filters"},
      h("input", {type:"search", id:"idea-search", placeholder:t("search"), "aria-label":t("search"), value:q, oninput:e => { q = e.target.value; draw(); }}),
      h("select", {id:"idea-cat", "aria-label":t("allCats"), onchange:e => { fCat = e.target.value; draw(); }}, h("option", {value:"", text:t("allCats")}), CATS.map((c, i) => h("option", {value:i, text:c, selected:String(i)===fCat}))),
      h("select", {id:"idea-inv", "aria-label":t("allInv"), onchange:e => { fInv = e.target.value; draw(); }}, h("option", {value:"", text:t("allInv")}), [1,2,3].map(i => h("option", {value:i, text:t("inv")[i], selected:String(i)===fInv})))),
    count, h("p", {class:"note", text:t("invNote")}), list); draw(); }

function viewCanvas(root){
  const cell = b => h("div", {class:"cell" + (b[0]==="va"||b[0]==="se" ? " key" : ""), style:"grid-area:"+b[0]},
    h("label", {for:"bmc-"+b[0], text:b[li()]}), h("small", {text:b[3+li()]}),
    h("textarea", {id:"bmc-"+b[0], value:S.bmc[b[0]] || "", oninput:e => { S.bmc[b[0]] = e.target.value; save(); }}));
  const getDoc = () => [t("canvasH") + (S.plan.name ? " : " + S.plan.name : ""), BMC.map(b => [b[li()], S.bmc[b[0]] || ""])];
  root.append(head(t("canvasH"), t("canvasP"), toolbar(getDoc, "business-model-canvas")), exNote(),
    h("div", {class:"bmc"}, BMC.slice(0,7).map(cell)), h("div", {class:"bmc2"}, BMC.slice(7).map(b => { const c = cell(b); c.style.gridArea = "auto"; return c; }))); }

function viewPlan(root){
  const res = h("div", {class:"result", id:"fin-result"});
  const drawFin = () => { const r = finCalc(S.plan.fin); res.textContent = "";
    res.append(h("div", null, h("span", {text:t("margin")}), h("strong", {class:r.margin < 0 ? "neg" : "pos", text:eur(r.margin)})),
      h("div", null, h("span", {text:t("be")}), h("strong", {text:r.breakeven == null ? t("beNone") : eur(r.breakeven)})), h("p", {class:"note", text:t("hyp")})); };
  const fin = (k, lab) => h("div", null, h("label", {for:"fin-"+k, text:lab}), h("input", {type:"number", id:"fin-"+k, min:"0", inputmode:"decimal", value:S.plan.fin[k], oninput:e => { S.plan.fin[k] = e.target.value; save(); drawFin(); }}));
  const getDoc = () => { const r = finCalc(S.plan.fin); return [S.plan.name || t("planH"), PLAN.map(p => [p[li()], (S.plan.s[p[0]] || "") + (p[0]==="finance" ? "\n\n"+t("rev")+" : "+num(S.plan.fin.rev)+"\n"+t("varp")+" : "+num(S.plan.fin.varp)+"\n"+t("fixed")+" : "+num(S.plan.fin.fixed)+"\n"+t("margin")+" : "+Math.round(r.margin)+" EUR\n"+t("be")+" : "+(r.breakeven==null ? t("beNone") : Math.round(r.breakeven)+" EUR")+"\n"+t("hyp") : "")])]; };
  root.append(head(t("planH"), t("planP"), toolbar(getDoc, "business-plan")), exNote(),
    h("div", {class:"sections"},
      h("div", {class:"sec"}, h("label", {for:"plan-name", text:t("name")}), h("input", {type:"text", id:"plan-name", value:S.plan.name || "", oninput:e => { S.plan.name = e.target.value; save(); }})),
      PLAN.map((p, i) => h("div", {class:"sec"}, h("h3", null, h("label", {for:"plan-"+p[0], text:(i+1)+". "+p[li()], style:"font:inherit;margin:0"})), h("p", {class:"hint", text:p[3+li()]}),
        p[0]==="finance" ? [h("div", {class:"fin"}, fin("rev", t("rev")), fin("varp", t("varp")), fin("fixed", t("fixed"))), res, h("div", {style:"height:.7rem"})] : null,
        h("textarea", {id:"plan-"+p[0], value:S.plan.s[p[0]] || "", oninput:e => { S.plan.s[p[0]] = e.target.value; save(); }}))))); drawFin(); }

function viewSwot(root){
  const quad = (k, lab) => { const ul = h("ul"); const inp = h("input", {type:"text", id:"swot-in-"+k, placeholder:t("addItem"), "aria-label":t("addItem")+" : "+lab});
    const draw = () => { ul.textContent = ""; S.swot[k].forEach((it, i) => ul.append(h("li", null, h("span", {text:it}), h("button", {class:"x", type:"button", "aria-label":t("remove")+" : "+it, text:"×", onclick:() => { S.swot[k].splice(i,1); save(); draw(); }})))); };
    const add = () => { const v = inp.value.trim(); if(!v) return; S.swot[k].push(v); inp.value = ""; save(); draw(); inp.focus(); };
    inp.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); add(); } }); draw();
    return h("div", {class:"cell"}, h("label", {for:"swot-in-"+k, text:lab}), ul, h("div", {class:"add"}, inp, h("button", {class:"btn", type:"button", id:"swot-add-"+k, text:t("add"), onclick:add}))); };
  const labs = {s:t("s"), w:t("w"), o:t("o"), t:t("th")};
  const getDoc = () => [t("swotH") + (S.plan.name ? " : " + S.plan.name : ""), Object.keys(labs).map(k => [labs[k], S.swot[k].map(x => "• " + x).join("\n")])];
  root.append(head(t("swotH"), t("swotP"), toolbar(getDoc, "swot")), exNote(), h("div", {class:"swot"}, Object.keys(labs).map(k => quad(k, labs[k])))); }

function viewCosts(root){
  const res = h("div", {class:"result", id:"cost-result"});
  const drawRes = () => { const r = costCalc(S.costs); res.textContent = ""; res.append(
    h("div", null, h("span", {text:t("totOnce")}), h("strong", {text:eur(r.once)})), h("div", null, h("span", {text:t("totMonthly")}), h("strong", {text:eur(r.monthly)})),
    h("div", null, h("span", {text:t("totCont")}), h("strong", {text:eur(r.cont)})), h("div", {style:"font-size:1.15rem;border-top:1px solid var(--line);padding-top:.4rem"}, h("span", {text:t("grand")}), h("strong", {text:eur(r.grand)})), h("p", {class:"note", text:t("hyp")})); };
  const block = (k, lab) => { const rows = h("div", {class:"rows"});
    const draw = () => { rows.textContent = ""; S.costs[k].forEach((r, i) => rows.append(h("div", {class:"row"},
      h("input", {type:"text", id:"cost-"+k+"-l"+i, "aria-label":t("label"), placeholder:t("label"), value:r[0], oninput:e => { r[0] = e.target.value; save(); }}),
      h("input", {type:"number", id:"cost-"+k+"-a"+i, min:"0", inputmode:"decimal", "aria-label":t("amount"), placeholder:"0", value:r[1], oninput:e => { r[1] = e.target.value; save(); drawRes(); }}),
      h("button", {class:"x", type:"button", "aria-label":t("remove"), text:"×", onclick:() => { S.costs[k].splice(i,1); save(); draw(); drawRes(); }})))); };
    draw(); return h("div", {class:"sec"}, h("h3", {text:lab}), rows, h("button", {class:"btn", type:"button", id:"cost-add-"+k, text:t("addRow"), onclick:() => { S.costs[k].push(["",""]); save(); draw(); }})); };
  const small = (k, lab) => h("div", null, h("label", {for:"cost-"+k, text:lab}), h("input", {type:"number", id:"cost-"+k, min:"0", inputmode:"decimal", value:S.costs[k], oninput:e => { S.costs[k] = e.target.value; save(); drawRes(); }}));
  const getDoc = () => { const r = costCalc(S.costs); const lines = a => a.filter(x => x[0] || x[1]).map(x => x[0] + " : " + num(x[1]) + " EUR").join("\n");
    return [t("costsH") + (S.plan.name ? " : " + S.plan.name : ""), [[t("once"), lines(S.costs.once)], [t("monthly"), lines(S.costs.monthly)], [t("grand"), t("months")+" : "+num(S.costs.months)+"\n"+t("cont")+" : "+num(S.costs.cont)+"\n"+t("totOnce")+" : "+Math.round(r.once)+" EUR\n"+t("totMonthly")+" : "+Math.round(r.monthly)+" EUR\n"+t("totCont")+" : "+Math.round(r.cont)+" EUR\n"+t("grand")+" : "+Math.round(r.grand)+" EUR\n"+t("hyp")]]]; };
  root.append(head(t("costsH"), t("costsP"), toolbar(getDoc, "couts-de-lancement")), exNote(), h("div", {class:"two"}, block("once", t("once")), block("monthly", t("monthly"))),
    h("div", {class:"sec", style:"margin-top:1rem"}, h("div", {class:"fin", style:"grid-template-columns:repeat(2,minmax(0,1fr))"}, small("months", t("months")), small("cont", t("cont"))), res)); drawRes(); }

let aiText = "", aiDesc = "", aiTool = "idea", aiCtl = null;
function viewAi(root){
  const out = h("div", {class:"ai-out", id:"ai-out", "aria-live":"polite", text:aiText});
  const gen = h("button", {class:"btn primary", type:"button", id:"ai-gen", text:t("gen")}), stop = h("button", {class:"btn", type:"button", id:"ai-stop", text:t("stop"), hidden:true});
  const off = h("p", {class:"note", id:"ai-off", text:t("aiOff"), hidden:true});
  const desc = h("textarea", {id:"ai-desc", value:aiDesc || (isExample ? "" : (S.plan.s.description || "")), oninput:e => { aiDesc = e.target.value; }});
  const copyB = h("button", {class:"btn", type:"button", id:"ai-copy", text:t("copy"), onclick:() => copyText(out.textContent)});
  root.append(head(t("aiH"), t("aiP")), off,
    h("div", {class:"sec"}, h("label", {for:"ai-tool", text:t("aiTool")}), h("select", {id:"ai-tool", onchange:e => { aiTool = e.target.value; }}, AI.map(a => h("option", {value:a[0], text:a[li()], selected:a[0]===aiTool}))),
      h("div", {style:"height:.7rem"}), h("label", {for:"ai-desc", text:t("aiDesc")}), desc, h("div", {class:"actions", style:"margin-top:.7rem"}, gen, stop, copyB), h("p", {class:"note", style:"margin-top:.6rem", text:t("aiWarn")})), out);
  aiP.then(sample => { if(!sample){ off.hidden = false; gen.disabled = true; return; }
    stop.onclick = () => aiCtl && aiCtl.abort();
    gen.onclick = async () => { const d = desc.value.trim(); if(!d){ desc.focus(); return; }
      const tool = AI.find(a => a[0] === aiTool), langName = {fr:"français", en:"anglais", ar:"arabe"}[lang];
      const prompt = "Tu es un conseiller en création d'entreprise prudent et concret. Réponds en " + langName + ".\n\nTâche : " + tool[4] + "\n\nProjet décrit par la personne :\n" + d + "\n\nRègles : ne cite aucune statistique de marché, aucun chiffre d'étude et aucun nom d'entreprise réelle que tu ne peux pas vérifier. Présente tout montant comme une hypothèse à vérifier. Ne promets aucune rentabilité. Signale les points réglementaires à vérifier auprès d'un organisme officiel. Format : texte brut sans Markdown, titres courts sur leur propre ligne, phrases simples.";
      aiCtl = new AbortController(); gen.disabled = true; stop.hidden = false; out.textContent = t("thinking");
      try{ const r = await sample(prompt, {signal:aiCtl.signal, cache:false, onText:({text}) => { out.textContent = text; }}); aiText = r.text; out.textContent = r.text; }
      catch(e){ aiText = (e && e.text) || ""; out.textContent = aiText; if(e && e.code === "not_granted"){ off.hidden = false; gen.disabled = true; stop.hidden = true; return; } if(!e || e.code !== "cancelled") toast(e && e.code === "rate_limited" ? t("limited") : t("err")); }
      gen.disabled = false; stop.hidden = true; }; }); }

const DRAW = {ideas:viewIdeas, canvas:viewCanvas, plan:viewPlan, swot:viewSwot, costs:viewCosts, ai:viewAi};
function current(){ const hsh = location.hash.replace("#",""); return VIEWS.find(v => HASH[v] === hsh) || "ideas"; }
function render(){ const cur = current();
  document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  $("pitch-h").textContent = t("pitch"); $("pitch-p").textContent = t("pitchP"); $("foot").textContent = t("foot");
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  const tabs = $("tabs"); tabs.textContent = ""; VIEWS.forEach(v => tabs.append(h("a", {href:"#"+HASH[v], "aria-current":v===cur ? "page" : null, text:t("t_"+v)})));
  const root = $("view"); root.textContent = ""; DRAW[cur](root); }
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => { lang = b.dataset.lang; store.set("lang", lang); render(); }));
window.addEventListener("hashchange", render);
render();
